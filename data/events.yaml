# مناسبت‌های تقویم (این فایل را ادمین ویرایش می‌کند)
#
# هر مناسبت:
#   month: ماه شمسی (۱ = فروردین ... ۱۲ = اسفند)
#   day:   روز
#   fa:    عنوان فارسی
#   en:    عنوان لاتین
#   note:  (اختیاری) توضیح کوتاه، هر دو زبان
#
# مناسبت ویژه: rule: chaharshanbe-suri  (شب آخرین چهارشنبهٔ سال، خودکار محاسبه می‌شود)
# برای اضافه کردن، یک خط مثل بقیه بنویس و فایل را ذخیره (Commit) کن.

